{% extends 'blog/base.html' %}

{% block title %}
Delete Post - My Blog
{% endblock %}

{% block content %}

<h1>Delete Post</h1>

<p>
    Are you sure you want to delete
    "<strong>{{ post.title }}</strong>"?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>
</form>

<p>
    <a class="DP" href="{% url 'post_detail' post.id %}">Cancel</a>
</p>

{% endblock %}
