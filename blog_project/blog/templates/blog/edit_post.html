{% extends 'blog/base.html' %}

{% block title %}
Edit Post - My Blog
{% endblock %}

{% block content %}

<h1>Edit Post</h1>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save Changes</button>
</form>

<p>
    <a class="DP" href="{% url 'post_detail' post.id %}">Cancel</a>
</p>

{% endblock %}
